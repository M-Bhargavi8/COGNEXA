{% extends "base.html" %}
{% from "_icons.html" import icon %}

{% block title %}Login -- COGNEXA{% endblock %}

{% block content %}

<div class="container cx-auth-wrap">

    <div class="cx-auth-card">

        <div class="text-center mb-4">
            <div class="mb-1 d-flex justify-content-center">{{ icon('brain', 32, 'icon--violet') }}</div>
            <h3 class="mb-1">Welcome back</h3>
            <p class="text-muted mb-0">Log in to keep training your brain.</p>
        </div>

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="login-email">Email</label>
                <input
                    id="login-email"
                    type="email"
                    name="email"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label for="login-password">Password</label>
                <input
                    id="login-password"
                    type="password"
                    name="password"
                    class="form-control"
                    required>
            </div>

            <button class="btn btn-cx-primary w-100 mt-2">
                Login
            </button>

        </form>

        <p class="text-center text-muted mt-4 mb-0">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Register</a>
        </p>

    </div>

</div>

{% endblock %}
