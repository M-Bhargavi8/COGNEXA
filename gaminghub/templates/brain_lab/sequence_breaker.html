{% extends "base.html" %}
{% from "_icons.html" import icon %}

{% block title %}Sequence Breaker -- COGNEXA{% endblock %}

{% block content %}

<div class="container py-5 text-center">

    <h2 class="text-light mb-2 d-flex align-items-center justify-content-center gap-2">{{ icon('logic', 28, 'icon--violet') }} Sequence Breaker</h2>
    <p class="text-light mb-4">Crack the pattern. What comes next?</p>

    <div id="difficultyPicker">
        <p class="text-light">Choose your challenge</p>
        <button class="btn btn-success btn-lg m-2" data-difficulty="easy">Easy</button>
        <button class="btn btn-warning btn-lg m-2" data-difficulty="medium">Medium</button>
        <button class="btn btn-danger btn-lg m-2" data-difficulty="hard">Hard</button>
        <button class="btn btn-dark btn-lg m-2" data-difficulty="expert">Expert</button>
    </div>

    <div id="gameArea" style="display:none;">

        <div id="sequenceDisplay" class="display-4 text-light mb-4"></div>

        <div class="mb-3">
            <input
                id="answerInput"
                type="text"
                class="form-control form-control-lg text-center mx-auto"
                style="max-width: 220px;"
                placeholder="?"
                aria-label="Next number in the sequence">
        </div>

        <button id="submitBtn" class="btn btn-success btn-lg">
            Submit
        </button>

    </div>

    <div id="resultArea" style="display:none;" class="mt-4">
        <h3 id="resultHeading" class="text-light"></h3>
        <p id="resultDetails" class="text-light"></p>
        <p id="bestBadge" class="text-warning fw-bold brain-lab-best"></p>
        <button id="playAgainBtn" class="btn btn-success btn-lg mt-3">
            Play Again
        </button>
    </div>

</div>

<script src="{{ url_for('static', filename='js/brain_lab/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/brain_lab/sequence_breaker.js') }}"></script>

{% endblock %}
