<!DOCTYPE html>
<html lang="en">
{% from "_icons.html" import icon %}
{% from "_logo.html" import mark %}

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Went Wrong -- COGNEXA</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/cognexa.css') }}">
</head>

<body>

<div class="container py-5">
    <div class="cx-card p-5 mx-auto text-center" style="max-width: 560px; margin-top: 4rem;">

        <div class="mb-3 d-flex justify-content-center">{{ mark(56) }}</div>

        <div class="mb-3 d-flex justify-content-center">{{ icon('warning', 40, 'icon--danger') }}</div>

        <span class="cx-eyebrow">500</span>
        <h2 class="mb-2">Something Went Wrong</h2>
        <p class="text-muted mb-4">An unexpected error occurred on our end. Try again in a moment.</p>

        <a href="/" class="btn btn-cx-primary">{{ icon('home', 18) }} Back to Home</a>

    </div>
</div>

</body>

</html>
