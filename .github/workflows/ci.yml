name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.11.13
      - run: ruff check .

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cognexa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cognexa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cognexa -d cognexa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Disposable CI database; not a secret.
      TEST_DATABASE_URL: postgresql://cognexa:ci-only-password@localhost:5432/cognexa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  migrations:
    name: Migrations (fresh upgrade, drift check, full downgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cognexa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cognexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cognexa -d cognexa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    strategy:
      matrix:
        database:
          - sqlite:////tmp/cognexa-ci.db
          - postgresql://cognexa:ci-only-password@localhost:5432/cognexa
    env:
      FLASK_APP: app
      APP_ENV: development
      DATABASE_URL: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Upgrade a fresh database to head
        run: flask db upgrade
      - name: Models and migrations agree
        run: flask db check
      - name: Seed scripts run against the migrated schema
        run: |
          python seed_games.py
          python seed_achievements.py
          python seed_shop_items.py
      - name: Downgrade all the way to base
        run: flask db downgrade base
      - name: Upgrade again
        run: flask db upgrade

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t cognexa:ci .
      - name: Migrate and start with a production configuration
        run: |
          # Throwaway values generated for this run only.
          SECRET_KEY="$(openssl rand -hex 32)"
          cat > ci.env <<EOF
          SECRET_KEY=${SECRET_KEY}
          APP_BASE_URL=https://ci.invalid
          DATABASE_URL=sqlite:////data/cognexa.db
          RATELIMIT_ALLOW_MEMORY_STORAGE=1
          MAIL_BACKEND=disabled
          EOF
          docker volume create cognexa-ci-data
          docker run --rm --env-file ci.env -v cognexa-ci-data:/data cognexa:ci flask --app wsgi db upgrade
          docker run --rm --env-file ci.env -v cognexa-ci-data:/data cognexa:ci python seed_games.py
          docker run -d --name cognexa-ci --env-file ci.env -v cognexa-ci-data:/data -p 8000:8000 cognexa:ci
      - name: Health check and pages respond
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz | grep '"ok"'
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null http://localhost:8000/login
      - name: Refuses to start with an unsafe configuration
        run: |
          if docker run --rm -e APP_ENV=production -e SECRET_KEY=short cognexa:ci python -c "import wsgi"; then
            echo "expected startup to fail"; exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs cognexa-ci 2>&1 | tail -50 || true
